# Web app (Next.js). Config reference: https://docs.fly.io/reference/configuration
# Deploy: fly deploy --config fly/web.toml --dockerfile Dockerfile
app = "blueyvatar-web"
primary_region = "iad"

[build]
  # Relative to this file (https://docs.fly.io/reference/configuration, [build] section).
  dockerfile = "../Dockerfile"

[env]
  PORT = "3000"

[experimental]
  # Per-app command override (https://docs.fly.io/reference/configuration, [experimental] section).
  cmd = ["sh", "-c", "cd apps/web && node_modules/.bin/next start -H 0.0.0.0 -p 3000"]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # https://docs.fly.io/reference/configuration, [[http_service.checks]] section
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

  # Readiness: SELECT 1 against Postgres (3 second budget, READY_TIMEOUT_MS).
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# Web app (Next.js). Config reference: https://docs.fly.io/reference/configuration
# Deploy: fly deploy --config fly/web.toml --dockerfile Dockerfile
app = "blueyvatar-web"
primary_region = "iad"

# Low-resource mode (docs/deploy.md): scale to zero, smallest VM that runs Next.js, one region.

[build]
  # Relative to this file (https://docs.fly.io/reference/configuration, [build] section).
  dockerfile = "../Dockerfile"

[env]
  PORT = "3000"

[experimental]
  # Per-app command override (https://docs.fly.io/reference/configuration, [experimental] section).
  cmd = ["sh", "-c", "cd apps/web && node_modules/.bin/next start -H 0.0.0.0 -p 3000"]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # One cheap liveness check. The readiness route /api/health runs SELECT 1 against Postgres, so it is
  # left out of the Fly checks: a check that touches the database every interval would keep the Neon
  # compute awake whenever this machine is running. Call /api/health by hand or from an uptime monitor.
  # https://docs.fly.io/reference/configuration, [[http_service.checks]] section
  [[http_service.checks]]
    grace_period = "20s"
    interval = "60s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

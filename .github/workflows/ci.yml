name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blueyvatar_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Point tests at the service port
        run: echo "TEST_DATABASE_URL=postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/blueyvatar_test" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate lexicon types
        run: pnpm lex:build

      - name: Build core
        run: pnpm --filter @blueyvatar/core build

      - name: Build hovercards
        run: pnpm --filter @blueyvatar/hovercards build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: pnpm -r --no-bail test

      - name: Build web
        run: pnpm --filter @blueyvatar/web build

  # Warns (never fails) when a pull request touches apps/ without a changelog line.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for a changelog change
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -q '^apps/' && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::warning file=CHANGELOG.md::This pull request changes apps/ but not CHANGELOG.md. If users or API developers will notice the change, add a line."
          fi

  docker:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t blueyvatar:ci .

  # Browser tests against `next start`, a stub delivery server, and the Postgres service below. No outside
  # services are called. Runs beside `check`, so it does not lengthen it.
  e2e:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blueyvatar_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Point the app at the service port
        run: echo "E2E_DATABASE_URL=postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/blueyvatar_test" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate lexicon types
        run: pnpm lex:build

      - name: Build core
        run: pnpm --filter @blueyvatar/core build

      - name: Build hovercards
        run: pnpm --filter @blueyvatar/hovercards build

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Build web
        run: pnpm --filter @blueyvatar/web build

      - name: Install Chromium
        run: pnpm --filter @blueyvatar/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

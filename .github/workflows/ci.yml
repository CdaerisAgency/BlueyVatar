name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Draft pull requests do not run CI. Marking one ready for review runs it once.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# One queue per ref. Runs for the same ref wait their turn and a newer pending run replaces an older pending
# one (GitHub keeps at most one running and one pending run per group). A single runner-wide group would
# drop pending runs of other pull requests, so cross-PR safety comes from the per-job pnpm folders and the
# free ports below instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Each job gets its own pnpm home and store so concurrent jobs on the shared self-hosted runner cannot
# remove each other's pnpm binary or share a half-written store.

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blueyvatar_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Point tests at the service port
        run: echo "TEST_DATABASE_URL=postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/blueyvatar_test" >> "$GITHUB_ENV"

      - name: Isolate pnpm per job
        run: |
          home="$RUNNER_TEMP/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
          mkdir -p "$home/store"
          echo "PNPM_HOME=$home" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=$home/store" >> "$GITHUB_ENV"
          echo "$home" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          # Install into the per-job folder. The default (~/setup-pnpm) is shared by
          # every runner on the machine, so concurrent jobs removed each other's pnpm.
          dest: ${{ env.PNPM_HOME }}/setup

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate lexicon types
        run: pnpm lex:build

      - name: Build core
        run: pnpm --filter @blueyvatar/core build

      - name: Build hovercards
        run: pnpm --filter @blueyvatar/hovercards build

      - name: Build avatar
        run: pnpm --filter @blueyvatar/avatar build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: pnpm -r --no-bail test

      - name: Build web
        run: pnpm --filter @blueyvatar/web build

      - name: Install Chromium for accessibility checks
        run: pnpm --filter @blueyvatar/web exec playwright install --with-deps chromium

      - name: Pick free ports
        run: node .github/scripts/free-port.mjs A11Y_PORT A11Y_DELIVERY_PORT

      - name: Accessibility (axe-core and hovercard keyboard)
        run: pnpm --filter @blueyvatar/web a11y

  # PHP lint and unit test for the WordPress plugin in integrations/wordpress.
  wordpress-plugin:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Ensure PHP is installed
        run: command -v php >/dev/null || (sudo apt-get update && sudo apt-get install -y php-cli)

      - name: Lint
        run: find integrations/wordpress -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Unit test
        run: php integrations/wordpress/tests/test-url.php

  # Warns (never fails) when a pull request touches apps/ without a changelog fragment.
  changelog:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for a changelog change
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -q '^apps/' && ! echo "$changed" | grep -qE '^(CHANGELOG\.md|changelog\.d/.+\.md)$'; then
            echo "::warning file=changelog.d::This pull request changes apps/ but adds no changelog fragment. If users or API developers will notice the change, add changelog.d/YYYY-MM-DD-short-slug.md (see changelog.d/README.md)."
          fi

  docker:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t blueyvatar:ci .

  # Browser tests against `next start`, a stub delivery server, and the Postgres service below. No outside
  # services are called. Runs beside `check`, so it does not lengthen it.
  e2e:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blueyvatar_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Point the app at the service port
        run: echo "E2E_DATABASE_URL=postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/blueyvatar_test" >> "$GITHUB_ENV"

      - name: Isolate pnpm per job
        run: |
          home="$RUNNER_TEMP/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
          mkdir -p "$home/store"
          echo "PNPM_HOME=$home" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=$home/store" >> "$GITHUB_ENV"
          echo "$home" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          # Install into the per-job folder. The default (~/setup-pnpm) is shared by
          # every runner on the machine, so concurrent jobs removed each other's pnpm.
          dest: ${{ env.PNPM_HOME }}/setup

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate lexicon types
        run: pnpm lex:build

      - name: Build core
        run: pnpm --filter @blueyvatar/core build

      - name: Build hovercards
        run: pnpm --filter @blueyvatar/hovercards build

      - name: Build avatar
        run: pnpm --filter @blueyvatar/avatar build

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Build web
        run: pnpm --filter @blueyvatar/web build

      - name: Install Chromium
        run: pnpm --filter @blueyvatar/web exec playwright install --with-deps chromium

      - name: Pick free ports
        run: node .github/scripts/free-port.mjs E2E_PORT E2E_STUB_PORT

      - name: E2E
        run: pnpm e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running deploy; later runs queue behind it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Opt-in: set the repository variable FLY_DEPLOY_ENABLED=true after the
    # first manual deploy creates the Fly apps (docs/deploy.md).
    if: vars.FLY_DEPLOY_ENABLED == 'true'
    # Runs only on the owner's CI runner (repository variable CI_RUNNER). There is
    # no GitHub-hosted fallback on purpose: this job holds FLY_API_TOKEN, so if the
    # variable is missing the job fails instead of running somewhere else.
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # https://github.com/superfly/flyctl-actions (README: pin flyctl with the version input)
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          # TODO: pin an exact flyctl release (the README recommends it); the current tag was not verified.
          version: latest

      # Delivery goes first: its release_command applies pending migrations.
      - name: Deploy delivery
        run: flyctl deploy --remote-only --config fly/delivery.toml --dockerfile Dockerfile

      - name: Deploy web
        run: flyctl deploy --remote-only --config fly/web.toml --dockerfile Dockerfile

      - name: Deploy indexer
        run: flyctl deploy --remote-only --config fly/indexer.toml --dockerfile Dockerfile

      # Smoke test of the live apps (tools/smoke/smoke.ts). It needs only Node. A failure fails the workflow.
      # Set the repository variable SMOKE_HANDLE to an account with an avatar to enable the cache and profile checks.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test production
        env:
          SMOKE_HANDLE: ${{ vars.SMOKE_HANDLE }}
          SMOKE_OPTED_OUT_HASH: ${{ vars.SMOKE_OPTED_OUT_HASH }}
        run: |
          # New machines and the edge can take a moment to settle, so retry a few times before failing.
          for attempt in 1 2 3; do
            if node --experimental-strip-types tools/smoke/smoke.ts --env production; then exit 0; fi
            echo "Smoke test failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

      # Tap is deployed by hand (docs/deploy.md): a restart interrupts the firehose
      # and a bad upgrade can force a re-backfill, so a person should watch it.
